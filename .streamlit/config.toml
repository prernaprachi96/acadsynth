# Black and white theme for AcadSynth. Streamlit reads this automatically.
# (Your API key stays in .streamlit/secrets.toml - this file has no secrets.)

[server]
maxUploadSize = 20   # MB per PDF

[theme]
base = "light"
primaryColor = "#000000"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F2F2"
textColor = "#000000"
linkColor = "#000000"
borderColor = "#000000"
showWidgetBorder = true
baseRadius = "small"
font = "sans serif"

# Colour is used ONLY for messages (success, error, warning, information).
greenColor = "#1B7A46"
redColor = "#B42318"
orangeColor = "#B54708"
yellowColor = "#B54708"
blueColor = "#1D4F9F"
violetColor = "#000000"
grayColor = "#000000"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F2F2"
textColor = "#000000"
